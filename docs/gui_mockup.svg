<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 860" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- ============================================================ -->
  <!-- Radio_App — concept mockup of a future desktop GUI.          -->
  <!-- Vector "screenshot": open in any browser / image viewer.     -->
  <!-- Illustrative only; nothing here is implemented yet.          -->
  <!-- ============================================================ -->
  <defs>
    <clipPath id="win"><rect x="0" y="0" width="1320" height="860" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <!-- window background -->
    <rect x="0" y="0" width="1320" height="860" fill="#0c1217"/>

    <!-- ============ title bar ============ -->
    <rect x="0" y="0" width="1320" height="40" fill="#0a0f13"/>
    <circle cx="20" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="6" fill="#febc2e"/>
    <circle cx="60" cy="20" r="6" fill="#28c840"/>
    <text x="660" y="25" text-anchor="middle" fill="#7d8b97" font-size="13" font-weight="600">Radio_App — multi-transport messenger</text>

    <!-- ============ left sidebar ============ -->
    <rect x="0" y="40" width="250" height="820" fill="#111920"/>
    <line x1="250" y1="40" x2="250" y2="860" stroke="#1c2730" stroke-width="1"/>

    <text x="20" y="80" fill="#e6edf3" font-size="20" font-weight="700">Radio_App</text>
    <text x="21" y="98" fill="#5f6e7a" font-size="11">off-grid · one inbox</text>

    <text x="20" y="130" fill="#5f6e7a" font-size="11" font-weight="700" letter-spacing="1">MODES</text>

    <!-- active mode highlight: Reticulum -->
    <rect x="12" y="140" width="226" height="40" rx="9" fill="#1b2a33"/>
    <rect x="12" y="146" width="3" height="28" rx="1.5" fill="#2dd4bf"/>

    <!-- Reticulum -->
    <rect x="20" y="146" width="26" height="26" rx="7" fill="#2dd4bf"/>
    <text x="33" y="164" text-anchor="middle" fill="#06302b" font-size="12" font-weight="700">R</text>
    <text x="56" y="164" fill="#e6edf3" font-size="14" font-weight="600">Reticulum</text>
    <circle cx="222" cy="159" r="5" fill="#34d399"/>

    <!-- JS8Call -->
    <rect x="20" y="190" width="26" height="26" rx="7" fill="#818cf8"/>
    <text x="33" y="208" text-anchor="middle" fill="#161046" font-size="11" font-weight="700">J8</text>
    <text x="56" y="208" fill="#c7d2db" font-size="14">JS8Call</text>
    <circle cx="222" cy="203" r="5" fill="#34d399"/>

    <!-- MeshCore -->
    <rect x="20" y="234" width="26" height="26" rx="7" fill="#4ade80"/>
    <text x="33" y="252" text-anchor="middle" fill="#06301a" font-size="12" font-weight="700">M</text>
    <text x="56" y="252" fill="#c7d2db" font-size="14">MeshCore</text>
    <circle cx="222" cy="247" r="5" fill="#fbbf24"/>

    <!-- Winlink -->
    <rect x="20" y="278" width="26" height="26" rx="7" fill="#38bdf8"/>
    <text x="33" y="296" text-anchor="middle" fill="#062a3a" font-size="12" font-weight="700">W</text>
    <text x="56" y="296" fill="#c7d2db" font-size="14">Winlink</text>
    <circle cx="222" cy="291" r="5" fill="#34d399"/>

    <!-- Mercury (down) -->
    <rect x="20" y="322" width="26" height="26" rx="7" fill="#475569"/>
    <text x="33" y="340" text-anchor="middle" fill="#c7d2db" font-size="11" font-weight="700">Hg</text>
    <text x="56" y="340" fill="#6b7783" font-size="14">Mercury</text>
    <circle cx="222" cy="335" r="5" fill="#6b7280"/>

    <!-- NomadNet -->
    <rect x="20" y="366" width="26" height="26" rx="7" fill="#fbbf24"/>
    <text x="33" y="384" text-anchor="middle" fill="#3a2a04" font-size="12" font-weight="700">N</text>
    <text x="56" y="384" fill="#c7d2db" font-size="14">NomadNet</text>
    <circle cx="222" cy="379" r="5" fill="#34d399"/>

    <!-- VIEWS -->
    <text x="20" y="430" fill="#5f6e7a" font-size="11" font-weight="700" letter-spacing="1">VIEWS</text>

    <circle cx="33" cy="455" r="6" fill="none" stroke="#7d8b97" stroke-width="1.6"/>
    <circle cx="33" cy="455" r="2" fill="#7d8b97"/>
    <text x="56" y="460" fill="#c7d2db" font-size="14">Watch</text>
    <text x="222" y="460" text-anchor="end" fill="#5f6e7a" font-size="11">live</text>

    <path d="M27 493 l6 6 l8 -10" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="500" fill="#c7d2db" font-size="14">Health</text>
    <text x="222" y="500" text-anchor="end" fill="#34d399" font-size="11">4/5 up</text>

    <path d="M33 532 l3.2 6.5 l7.2 1 l-5.2 5.1 l1.2 7.1 l-6.4 -3.4 l-6.4 3.4 l1.2 -7.1 l-5.2 -5.1 l7.2 -1 z" fill="#fbbf24"/>
    <text x="56" y="540" fill="#c7d2db" font-size="14">Favorites</text>
    <text x="222" y="540" text-anchor="end" fill="#5f6e7a" font-size="11">7</text>

    <!-- station card -->
    <rect x="12" y="784" width="226" height="60" rx="12" fill="#16212a"/>
    <circle cx="42" cy="814" r="18" fill="#2dd4bf"/>
    <text x="42" y="819" text-anchor="middle" fill="#06302b" font-size="13" font-weight="700">K0</text>
    <text x="70" y="809" fill="#e6edf3" font-size="14" font-weight="600">K0LEO</text>
    <text x="70" y="827" fill="#6b7783" font-size="11">Grid EM79 · rnsd connected</text>
    <circle cx="226" cy="800" r="9" fill="none" stroke="#475569" stroke-width="1.4"/>
    <circle cx="226" cy="800" r="2.4" fill="#475569"/>

    <!-- ============ main top bar ============ -->
    <rect x="250" y="40" width="1070" height="56" fill="#0e151b"/>
    <line x1="250" y1="96" x2="1320" y2="96" stroke="#1c2730" stroke-width="1"/>

    <text x="570" y="72" fill="#e6edf3" font-size="18" font-weight="700">@TTP</text>
    <text x="570" y="90" fill="#6b7783" font-size="12">group net · 6 members · interleaving JS8Call · Reticulum · MeshCore</text>

    <!-- status pills -->
    <rect x="1058" y="57" width="66" height="22" rx="11" fill="#172a26"/>
    <rect x="1071" y="64" width="9" height="7" rx="1.5" fill="none" stroke="#34d399" stroke-width="1.4"/>
    <path d="M1073 64 v-2 a2.5 2.5 0 0 1 5 0 v2" fill="none" stroke="#34d399" stroke-width="1.4"/>
    <text x="1086" y="72" fill="#34d399" font-size="11" font-weight="600">E2E</text>

    <rect x="1130" y="57" width="74" height="22" rx="11" fill="#16212a"/>
    <text x="1167" y="72" text-anchor="middle" fill="#9fb0bd" font-size="11" font-weight="600">6 peers</text>

    <rect x="1212" y="57" width="88" height="22" rx="11" fill="#172a26"/>
    <path d="M1224 68 l4 4 l7 -8" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1244" y="72" fill="#34d399" font-size="11" font-weight="600">rnsd</text>

    <!-- ============ threads column ============ -->
    <rect x="250" y="96" width="300" height="764" fill="#0f161c"/>
    <line x1="550" y1="96" x2="550" y2="860" stroke="#1c2730" stroke-width="1"/>

    <text x="266" y="128" fill="#e6edf3" font-size="14" font-weight="700">Conversations</text>
    <rect x="266" y="140" width="268" height="32" rx="8" fill="#18222b"/>
    <circle cx="284" cy="156" r="5" fill="none" stroke="#6b7783" stroke-width="1.5"/>
    <line x1="288" y1="160" x2="292" y2="164" stroke="#6b7783" stroke-width="1.5" stroke-linecap="round"/>
    <text x="300" y="161" fill="#6b7783" font-size="12">Search messages…</text>

    <!-- thread: @TTP (active) -->
    <rect x="250" y="186" width="300" height="66" fill="#16222b"/>
    <rect x="250" y="186" width="3" height="66" fill="#2dd4bf"/>
    <circle cx="288" cy="219" r="18" fill="#2dd4bf"/>
    <text x="288" y="224" text-anchor="middle" fill="#06302b" font-size="13" font-weight="700">TTP</text>
    <text x="316" y="213" fill="#e6edf3" font-size="14" font-weight="700">@TTP</text>
    <text x="316" y="233" fill="#8b98a5" font-size="12">N0DXX · Copy, 2 stations behind…</text>
    <text x="534" y="211" text-anchor="end" fill="#6b7783" font-size="11">now</text>
    <circle cx="524" cy="230" r="9" fill="#2dd4bf"/>
    <text x="524" y="234" text-anchor="middle" fill="#06302b" font-size="11" font-weight="700">2</text>

    <!-- thread: KE7XYZ -->
    <circle cx="288" cy="285" r="18" fill="#818cf8"/>
    <text x="288" y="290" text-anchor="middle" fill="#161046" font-size="13" font-weight="700">K</text>
    <text x="316" y="279" fill="#dfe6ec" font-size="14" font-weight="600">KE7XYZ</text>
    <text x="316" y="299" fill="#8b98a5" font-size="12">see you on 40m</text>
    <text x="534" y="277" text-anchor="end" fill="#6b7783" font-size="11">3m</text>
    <rect x="316" y="304" width="34" height="15" rx="4" fill="#23304a"/>
    <text x="333" y="315" text-anchor="middle" fill="#9aa9f5" font-size="9" font-weight="700">JS8</text>

    <!-- thread: @ALLCALL -->
    <circle cx="288" cy="351" r="18" fill="#475569"/>
    <text x="288" y="356" text-anchor="middle" fill="#dfe6ec" font-size="14" font-weight="700">@</text>
    <text x="316" y="345" fill="#dfe6ec" font-size="14" font-weight="600">@ALLCALL</text>
    <text x="316" y="365" fill="#8b98a5" font-size="12">VE3ABC · CQ CQ DX</text>
    <text x="534" y="343" text-anchor="end" fill="#6b7783" font-size="11">8m</text>

    <!-- thread: Bob (LXMF, encrypted) -->
    <circle cx="288" cy="417" r="18" fill="#2dd4bf"/>
    <text x="288" y="422" text-anchor="middle" fill="#06302b" font-size="14" font-weight="700">B</text>
    <text x="316" y="411" fill="#dfe6ec" font-size="14" font-weight="600">Bob</text>
    <rect x="349" y="401" width="9" height="7" rx="1.5" fill="none" stroke="#6b7783" stroke-width="1.2"/>
    <path d="M351 401 v-1.6 a2 2 0 0 1 4 0 v1.6" fill="none" stroke="#6b7783" stroke-width="1.2"/>
    <text x="316" y="431" fill="#8b98a5" font-size="12">thanks for the file!</text>
    <text x="534" y="409" text-anchor="end" fill="#6b7783" font-size="11">1h</text>
    <rect x="316" y="436" width="34" height="15" rx="4" fill="#173a36"/>
    <text x="333" y="447" text-anchor="middle" fill="#4fd6c4" font-size="9" font-weight="700">RET</text>

    <!-- thread: RMS Halifax (winlink) -->
    <circle cx="288" cy="483" r="18" fill="#38bdf8"/>
    <text x="288" y="488" text-anchor="middle" fill="#062a3a" font-size="13" font-weight="700">R</text>
    <text x="316" y="477" fill="#dfe6ec" font-size="14" font-weight="600">RMS Halifax</text>
    <text x="316" y="497" fill="#8b98a5" font-size="12">bulletin: propagation forecast…</text>
    <text x="534" y="475" text-anchor="end" fill="#6b7783" font-size="11">2h</text>
    <rect x="316" y="502" width="30" height="15" rx="4" fill="#0e3349"/>
    <text x="331" y="513" text-anchor="middle" fill="#6cc6f0" font-size="9" font-weight="700">WL</text>

    <!-- ============ message pane ============ -->
    <rect x="550" y="96" width="770" height="764" fill="#0c1217"/>

    <!-- date divider -->
    <rect x="888" y="116" width="94" height="22" rx="11" fill="#16212a"/>
    <text x="935" y="131" text-anchor="middle" fill="#7d8b97" font-size="11">Today</text>

    <!-- m1 incoming KE7XYZ (JS8) -->
    <text x="584" y="166" fill="#6b7783" font-size="11">KE7XYZ · <tspan fill="#9aa9f5">JS8Call</tspan> · SNR −3 dB · 19:42</text>
    <rect x="580" y="174" width="486" height="42" rx="13" fill="#1b252e"/>
    <text x="600" y="200" fill="#e6edf3" font-size="14">Net starting in 5 — please check in with name + grid.</text>

    <!-- m2 incoming VE3ABC (Reticulum) -->
    <text x="584" y="244" fill="#6b7783" font-size="11">VE3ABC · <tspan fill="#4fd6c4">Reticulum</tspan> · 19:42</text>
    <rect x="580" y="252" width="330" height="42" rx="13" fill="#1b252e"/>
    <text x="600" y="278" fill="#e6edf3" font-size="14">Standing by — strong signal here.</text>

    <!-- m3 outgoing You (Reticulum) -->
    <text x="1286" y="322" text-anchor="end" fill="#6b7783" font-size="11">You · Reticulum · <tspan fill="#34d399">✓✓ delivered</tspan> · 19:43</text>
    <rect x="978" y="330" width="308" height="42" rx="13" fill="#1d4ed8"/>
    <text x="998" y="356" fill="#ffffff" font-size="14">K0LEO here, ready to copy.</text>

    <!-- m4 incoming N0DXX (MeshCore) -->
    <text x="584" y="400" fill="#6b7783" font-size="11">N0DXX · <tspan fill="#7ee2a8">MeshCore</tspan> · 2 hops · 19:44</text>
    <rect x="580" y="408" width="356" height="42" rx="13" fill="#1b252e"/>
    <text x="600" y="434" fill="#e6edf3" font-size="14">Copy — 2 stations behind you.</text>

    <!-- system: chunking notice (showcases app-level chunking) -->
    <rect x="650" y="470" width="570" height="28" rx="14" fill="#14202a"/>
    <path d="M672 484 a6 6 0 1 1 -1.6 -4.1 M671 478 v3 h3" fill="none" stroke="#5f6e7a" stroke-width="1.4" stroke-linecap="round"/>
    <text x="935" y="488" text-anchor="middle" fill="#7d8b97" font-size="11">Long roll-call sent in 3 frames over JS8Call · reassembled · ACKed</text>

    <!-- m5 incoming KE7XYZ (JS8) -->
    <text x="584" y="528" fill="#6b7783" font-size="11">KE7XYZ · <tspan fill="#9aa9f5">JS8Call</tspan> · SNR −1 dB · 19:45</text>
    <rect x="580" y="536" width="372" height="42" rx="13" fill="#1b252e"/>
    <text x="600" y="562" fill="#e6edf3" font-size="14">Roger — taking check-ins now, go ahead.</text>

    <!-- typing indicator -->
    <circle cx="592" cy="606" r="3" fill="#5f6e7a"/>
    <circle cx="602" cy="606" r="3" fill="#5f6e7a"/>
    <circle cx="612" cy="606" r="3" fill="#5f6e7a"/>
    <text x="626" y="610" fill="#6b7783" font-size="12">VE3ABC is typing…</text>

    <!-- scrollbar hint -->
    <rect x="1310" y="150" width="4" height="150" rx="2" fill="#243039"/>

    <!-- ============ compose bar ============ -->
    <text x="1286" y="780" text-anchor="end" fill="#5f6e7a" font-size="11">end-to-end encrypted · 0 / 1 MB</text>
    <rect x="570" y="790" width="640" height="52" rx="14" fill="#18222b" stroke="#243039" stroke-width="1"/>
    <circle cx="598" cy="816" r="14" fill="#243039"/>
    <line x1="598" y1="810" x2="598" y2="822" stroke="#9fb0bd" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="592" y1="816" x2="604" y2="816" stroke="#9fb0bd" stroke-width="1.8" stroke-linecap="round"/>
    <text x="628" y="821" fill="#6b7783" font-size="14">Message @TTP…  ( / for commands )</text>
    <rect x="1224" y="798" width="86" height="36" rx="10" fill="#2dd4bf"/>
    <text x="1267" y="821" text-anchor="middle" fill="#06302b" font-size="14" font-weight="700">Send</text>
  </g>

  <!-- crisp window border on top -->
  <rect x="0.5" y="0.5" width="1319" height="859" rx="14" fill="none" stroke="#000000" stroke-width="1"/>
</svg>

