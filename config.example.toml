favorites = [
    { id = "W1AW", label = "", last_seen = "2026-06-26T03:35:01.790236+00:00" },
]

[general]
display_name = "Anonymous"
default_mode = "auto"
# How many days of message history (and cached NomadNet pages) to keep. The
# database grows over time, so on small devices set a positive number to
# auto-prune anything older on startup. 0 = keep everything forever. You can
# also prune on demand with 'radioapp db prune --days N' and reclaim space with
# 'radioapp db vacuum'; 'radioapp db stats' shows the current size.
history_retention_days = 0

[station]
callsign = ""
grid_square = ""

[compliance]
allow_encrypted_on_hf = false

[storage]
database = "conversations.db"
# Single folder where ALL downloadable content is saved locally — Winlink
# attachments, Reticulum/LXMF file attachments, etc. You're asked for this
# during first-run setup, and every mode saves here. A relative path is taken
# relative to this config file's folder. Blank = the default app data dir
# ($XDG_DATA_HOME/radio_app/downloads, i.e. ~/.local/share/radio_app/downloads).
download_dir = ""

[transports.reticulum]
enabled = true
config_path = ""
# The app ONLY attaches to an external rnsd shared instance; it never starts its
# own. If rnsd isn't running yet, it keeps retrying every reconnect_interval
# seconds and attaches automatically once rnsd appears.
reconnect_interval = 10
announce_on_start = true
announce_monitor = true
display_name = ""
# Where received file attachments (LXMF file fields) are saved. Blank uses the
# central [storage].download_dir (shared by all modes); set this only to give
# Reticulum its own override.
attachments_dir = ""

[transports.reticulum.rnode]
port = "/dev/ttyUSB0"
frequency = 915000000
bandwidth = 125000
spreadingfactor = 8
codingrate = 5
txpower = 7

[transports.js8call]
enabled = false
host = "127.0.0.1"
port = 2442
callsign = "N0CALL"
presence_quiet_seconds = 600

[transports.mercury]
enabled = false
host = "127.0.0.1"
port = 7373

[transports.meshcore]
enabled = false
connection = "serial"
port = "/dev/ttyACM0"
baud = 115200
host = "127.0.0.1"
tcp_port = 5000
# Prepend your node name to outbound channel messages ("Name: message").
# Off by default — bare message content is sent and other MeshCore nodes
# will not see a sender name. Enable if you share a channel with stock
# MeshCore devices that rely on the name prefix for attribution.
# prepend_name = false

# Winlink (store-and-forward email over radio) via a separately-installed Pat
# client (https://github.com/la5nta/pat). Pat is NOT bundled — install it
# yourself and run `pat http`; this app talks to its HTTP API.
[transports.winlink]
enabled = false
# Base URL of the running Pat HTTP server.
pat_url = "http://127.0.0.1:8080"
# Your Winlink callsign (used as the local mailbox identity).
callsign = "N0CALL"
# How Pat reaches a gateway. "auto" tries each path in `connect_order` and uses
# the first that's reachable and connects — you don't pick telnet vs a modem.
# Or force one: "telnet" | "ardop" | "varahf" (incl. Mercury) | "varafm" |
# "pactor" | "ax25".
connect = "auto"
connect_order = ["telnet", "varahf", "ardop"]
# Probe host/ports used to detect which RF modem is running before dialing it
# (and to show modem up/down on the Health board).
probe_host = "127.0.0.1"
vara_port = 8300            # Mercury or VARA HF control port
ardop_port = 8515          # ARDOP TNC port
# RMS gateway callsign for RF, or leave empty for telnet (Pat's default CMS).
# You can also set per-method gateways, e.g. varahf_gateway = "KW1U".
gateway = ""
# Optional full escape hatch: a raw Pat connect URL that overrides everything.
connect_url = ""
# Seconds between inbox polls for newly received mail.
poll_interval = 60
# Where /save downloads received attachments. Blank uses the central
# [storage].download_dir (shared by all modes); set this only to give Winlink
# its own override.
download_dir = ""
# When true, each send immediately dials the gateway; when false (default),
# messages queue in Pat's outbox for the next session you start.
auto_connect = false
# When true, the connect session log echoes Pat's full raw transcript (verbose,
# and includes replayed backlog). Default false shows only concise live events
# (dialing/connected, per-message transfer progress) plus a final summary.
verbose_session_log = false

[groups.EMS]
display_name = "EMS Net"
transports = [
    "js8call",
    "reticulum",
]
# Cross-mode membership (INCOMING aggregation only — outbound fan-out is not
# done yet). Membership is entirely operator-declared; the app never guesses
# that two identities are "the same person". Manage these with the CLI:
#   radioapp group EMS add js8call:KE0XYZ
#   radioapp group EMS add reticulum:ff00112233...
#   radioapp group EMS tag ems        # a JS8 @group or Winlink subject tag
#   radioapp group EMS show
# A member is "transport:identifier" (a bare "identifier" matches any
# transport); hex hashes are prefix-tolerant, callsigns case-insensitive.
members = [
    "js8call:KE0XYZ",
    "reticulum:ff00112233445566778899aabbccddeeff",
]
# Native group names / labels that also map a message into this group
# regardless of who sent it (e.g. a JS8 @EMS group or a Winlink "ems" tag).
tags = [
    "ems",
]

[groups.EMSNE]
display_name = "EMS NE Region"
transports = [
    "js8call",
]

[subscriptions]
groups = [
    "EMS",
    "EMSNE",
]
show_unsubscribed = false

[[filters]]
name = "EMS on HF gets my attention"
action = "notify"

[filters.match]
group = "EMS"
transport = "js8call"

[[filters]]
name = "Keep all EMS* groups quietly"
action = "file"

[filters.match]
group = "EMS*"

[[filters]]
name = "Default"
action = "show"

[ui]
theme = ""
# Landing surface shown at startup. Leave empty to open the first configured
# transport (the default). Other options: a transport name (e.g. "meshcore",
# "js8call", "reticulum"), "nomadnet", "watch", "health", or "favorites".
home = ""
# Max rows the Watch live feed keeps in memory (in-app scrollback only; full
# history lives in the database). Bounded so a long session on a busy band can't
# grow memory without limit. 0 = unbounded (not recommended on small devices).
watch_buffer_limit = 1000

[logging]
file = "radio_app.log"
level = "INFO"
# Size-based rotation for the on-disk log file. max_bytes = 0 disables rotation
# (the file then grows without bound). The in-app Logs surface is in-memory and
# unaffected by these settings.
max_bytes = 1048576   # rotate after ~1 MiB
backup_count = 3      # keep radio_app.log.1 .. .3
